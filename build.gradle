plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Modrinth Maven: used for development-only runtime mods (Sodium / Iris).
    // `exclusiveContent` makes Gradle ask this repository ONLY for the `maven.modrinth` group,
    // which keeps dependency resolution fast and avoids leaking lookups to other repositories.
    // Coordinates: maven.modrinth:<project-slug>:<version_number>
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Illusive Soulworks"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "AppleSkin"
        url = "https://maven.ryanliptak.com/"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    // CurseMaven: Farmer's Delight 26 Neo port (and other Curse-only jars).
    // Coordinates: curse.maven:<slug>-<projectId>:<fileId>
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    // FTB Quests / Library / Teams (docs/MODPACK.md pack content)
    maven {
        name = "FTB"
        url = "https://maven.ftb.dev/releases"
    }
    // Local jars (Celesthyd Lib — required by SG Economy; not on Modrinth)
    flatDir {
        dirs 'libs'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Example addon (examples/rs-api-sample) — compile always; load only with -PsampleAddon=true
// (off by default: it is an API demo, not pack content).
def runningGameTests = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
def sampleAddonEnabled = project.findProperty('sampleAddon') == 'true'
// Pack medicine addon — compile always; load like packcontent (on for runClient; off GameTest).
// Force: -PmedicineAddon=true|false
def medicineAddonEnabled = project.findProperty('medicineAddon') == 'true'
        || (project.findProperty('medicineAddon') != 'false' && !runningGameTests)

sourceSets {
    addonExample {
        java {
            srcDir 'examples/rs-api-sample/src/main/java'
        }
        resources {
            srcDir 'examples/rs-api-sample/src/main/resources'
        }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    medicineAddon {
        java {
            srcDir 'addons/rs-medicine/src/main/java'
        }
        resources {
            srcDir 'addons/rs-medicine/src/main/resources'
        }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            // INFO for pack smoke tests (DEBUG floods GameLocator mask lines for minutes).
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        if (sampleAddonEnabled) {
            rsnapisample {
                sourceSet(sourceSets.addonExample)
            }
        }
        if (medicineAddonEnabled) {
            rsmedicine {
                sourceSet(sourceSets.medicineAddon)
            }
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ---------------------------------------------------------------------------------------------
    // Shader test environment (development only): Sodium + Iris for NeoForge / Minecraft 26.1.
    //
    // `localRuntime` is the MDK's runtime-only configuration: it feeds `runtimeClasspath` (so the jars are
    // on the classpath of `gradlew runClient`) but is NOT exported to consumers of this mod, unlike plain
    // `runtimeOnly`. Nothing here is compiled against.
    //
    // ModDevGradle no longer supports per-run classpaths for Minecraft 26.1, so these jars are also present
    // when running `runServer`. That is safe: both mods declare `@Mod(dist = Dist.CLIENT)`, so FML never
    // instantiates them on a dedicated server. To boot without them (e.g. to isolate a rendering bug):
    //     gradlew runClient -PclientMods=false
    //
    // Versions live in gradle.properties (sodium_version / iris_version) for MC/NeoForge 26.1.2.
    // ---------------------------------------------------------------------------------------------
    // Nested Sodium mod jar (see extractSodiumApi) — compileOnly for BlendedColorProvider; not shipped.
    compileOnly files("${layout.buildDirectory.get()}/sodium-api/sodium-mod.jar")
    if (project.findProperty('clientMods') != 'false') {
        localRuntime "maven.modrinth:sodium:${sodium_version}"
        localRuntime "maven.modrinth:iris:${iris_version}"
    }

    // Curios: optional publish dep; present in runClient so accessory slots can be verified.
    // No compile dependency yet — slots are datapack-only until we add accessory items.
    // Auto-skipped when the requested tasks include GameTestServer (mock players cannot negotiate Curios payloads).
    // Force on/off: -Pcurios=true|false
    def curiosEnabled = project.findProperty('curios') == 'true' || (project.findProperty('curios') != 'false' && !runningGameTests)
    if (curiosEnabled) {
        localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    }

    // AppleSkin: hunger/saturation icons (tooltips + HUD). Required on client via mods.toml.
    // localRuntime so runClient loads it; not compiled against (no AppleSkin API imports).
    localRuntime "squeek.appleskin:appleskin-neoforge:${appleskin_version}"

    // JEI: optional publish dep; compileOnly API for plugin; localRuntime for runClient.
    compileOnly "mezz.jei:jei-26.1.2-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:${jei_version}"
    // FTB Chunks API for minimap info rows (season/clock/temp). Runtime jar is packcontent localRuntime.
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
    if (project.findProperty('jei') != 'false') {
        localRuntime "mezz.jei:jei-26.1.2-neoforge:${jei_version}"
    }

    // Serene Seasons + GlitchCore: optional soft-compat; present in runClient for season testing.
    // Auto-skip on GameTestServer (mock players cannot receive sereneseasons:sync_season_cycle).
    // Force on/off: -Psereneseasons=true|false
    def sereneSeasonsEnabled = project.findProperty('sereneseasons') == 'true'
            || (project.findProperty('sereneseasons') != 'false' && !runningGameTests)
    if (sereneSeasonsEnabled) {
        localRuntime "maven.modrinth:glitchcore:${glitchcore_version}"
        localRuntime "maven.modrinth:serene-seasons:${serene_seasons_version}"
    }

    // Farmer's Delight: optional soft-compat (drink/crop datapacks gated by mod_loaded).
    // Unofficial NeoForge 26.1.2 port (project 1699768). Disable: -Pfarmersdelight=false
    // Auto-skip on GameTestServer — FD ships its own required tests that fail in this harness.
    def farmersDelightEnabled = project.findProperty('farmersdelight') == 'true'
            || (project.findProperty('farmersdelight') != 'false' && !runningGameTests)
    if (farmersDelightEnabled) {
        localRuntime "curse.maven:farmers-delight-26-neo-ver-${farmers_delight_project}:${farmers_delight_file}"
    }

    // Cloth Config + Aquaculture + Fish of Thieves: optional soft-compat; present in runClient.
    // FoT requires cloth_config. Disable: -Pfishingmods=false
    if (project.findProperty('fishingmods') != 'false') {
        localRuntime "maven.modrinth:cloth-config:${cloth_config_version}"
        localRuntime "maven.modrinth:aquaculture:${aquaculture_version}"
        localRuntime "maven.modrinth:fish-of-thieves:${fish_of_thieves_version}"
    }

    // Create: optional soft-compat (fluid/item automation). Official Create has no Minecraft 26.1
    // NeoForge publish yet (latest Modrinth = 1.21.1). When a 26.1 jar exists, set create_version
    // in gradle.properties and enable: -Pcreate=true
    if (project.findProperty('create') == 'true') {
        throw new GradleException(
                "Create is not available for Minecraft ${minecraft_version} yet. " +
                "Remove -Pcreate=true until a NeoForge 26.1 Create build is published " +
                "(see https://modrinth.com/mod/create)."
        )
    }

    // Large Fluid Tank + Pipez: Create stand-in for fluid storage/transport on 26.1.
    // Soft-compat only (no recipe changes). Auto-skip on GameTestServer; force: -Pfluidstack=true|false
    def fluidStackEnabled = project.findProperty('fluidstack') == 'true'
            || (project.findProperty('fluidstack') != 'false' && !runningGameTests)
    if (fluidStackEnabled) {
        localRuntime "maven.modrinth:scalable-cats-force:${scalable_cats_force_version}"
        localRuntime "maven.modrinth:large-fluid-tank:${large_fluid_tank_version}"
        localRuntime "maven.modrinth:pipez:${pipez_version}"
    }

    // Pack QoL / maps / voice / ambient / perf (docs/MODPACK.md). Soft-compat only.
    // Auto-skip on GameTestServer; force: -Ppackqol=true|false
    def packQolEnabled = project.findProperty('packqol') == 'true'
            || (project.findProperty('packqol') != 'false' && !runningGameTests)
    if (packQolEnabled) {
        localRuntime "maven.modrinth:jade:${jade_version}"
        // Jade Addons skipped: jar still uses @OnlyIn → NeoForge 26.1 boot warning
        // (no runtime stripping). Re-add when upstream ships an OnlyIn-free build.
        localRuntime "maven.modrinth:mouse-tweaks:${mouse_tweaks_version}"
        localRuntime "maven.modrinth:balm:${balm_version}"
        localRuntime "maven.modrinth:trashslot:${trashslot_version}"
        localRuntime "maven.modrinth:iron-chests:${iron_chests_version}"
        localRuntime "maven.modrinth:simple-voice-chat:${simple_voice_chat_version}"
        localRuntime "maven.modrinth:creativecore:${creativecore_version}"
        localRuntime "maven.modrinth:ambientsounds:${ambientsounds_version}"
        localRuntime "maven.modrinth:entityculling:${entityculling_version}"
        localRuntime "maven.modrinth:modernfix:${modernfix_version}"
        localRuntime "maven.modrinth:ferrite-core:${ferrite_core_version}"
        // Season display — Serene Seasons companion; RS calendar HUD defers when this is present
        localRuntime "maven.modrinth:seasonhud:${seasonhud_version}"
        // Maps: FTB Chunks (packcontent) — Xaero removed
    }

    // Pack content mods (quests, biomes, exploration, …). Soft-compat / load test only.
    // Auto-skip on GameTestServer; force: -Ppackcontent=true|false
    // Skipped until ready: Comforts (needs rs-comforts), When Dungeons Arise (no 26.1 jar), Dynamic Trees.
    def packContentEnabled = project.findProperty('packcontent') == 'true'
            || (project.findProperty('packcontent') != 'false' && !runningGameTests)
    if (packContentEnabled) {
        // Waystones needs Balm + Shogi even if packqol is off
        if (!packQolEnabled) {
            localRuntime "maven.modrinth:balm:${balm_version}"
        }
        localRuntime "maven.modrinth:shogi:${shogi_version}"

        localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        localRuntime "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
        localRuntime "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
        // Maps + chunk claim/forceload (replaces Xaero + OPC)
        localRuntime "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
        // XMod POM also pulls Essentials/Ranks/Backups — exclude those; Chunks is pinned above.
        localRuntime("dev.ftb.mods:ftb-xmod-compat-neoforge:${ftb_xmod_compat_version}") {
            exclude group: 'dev.ftb.mods', module: 'ftb-backups-3'
            exclude group: 'dev.ftb.mods', module: 'ftb-ranks-neoforge'
            exclude group: 'dev.ftb.mods', module: 'ftb-ranks'
            exclude group: 'dev.ftb.mods', module: 'ftb-essentials-neoforge'
            exclude group: 'dev.ftb.mods', module: 'ftb-essentials'
            exclude group: 'dev.ftb.mods', module: 'ftb-filter-system-neoforge'
            exclude group: 'dev.ftb.mods', module: 'ftb-filter-system'
        }

        localRuntime "maven.modrinth:better-advancements:${better_advancements_version}"
        // Advancement Plaques needs Iceberg, which shades nightconfig and crashes FML on 26.1
        // (IllegalAccessError: ConfigSpec).<init>). Re-add when Iceberg ships a compatible build.

        localRuntime "maven.modrinth:cristel-lib:${cristel_lib_version}"
        localRuntime "maven.modrinth:towns-and-towers:${towns_and_towers_version}"
        localRuntime "maven.modrinth:lootr:${lootr_version}"

        localRuntime "curse.maven:spice-of-life-carrot-edition-${solcarrot_project}:${solcarrot_file}"

        // GlitchCore also required by Serene Seasons; pin again so BoP works if -Psereneseasons=false
        localRuntime "maven.modrinth:glitchcore:${glitchcore_version}"
        localRuntime "maven.modrinth:terrablender:${terrablender_version}"
        localRuntime "maven.modrinth:biomes-o-plenty:${biomes_o_plenty_version}"
        localRuntime "maven.modrinth:waystones:${waystones_version}"
        localRuntime "maven.modrinth:waystones-teleport-pets:${waystones_teleport_pets_version}"
        localRuntime "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
        localRuntime "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
        localRuntime "maven.modrinth:natures-compass:${natures_compass_version}"
        localRuntime "maven.modrinth:artifacts:${artifacts_version}"
        localRuntime "maven.modrinth:guard-villagers:${guard_villagers_version}"
        localRuntime "maven.modrinth:pet_home:${pet_home_version}"
        localRuntime "maven.modrinth:treeliable:${treeliable_version}"

        // Oritech industrial progression. Vendor the actual jars: Modrinth Maven metadata
        // resolves POMs here but does not reliably put the mod jar on runClient's runtime classpath.
        // Athena + GeckoLib are required. Oritech Things remains excluded (alpha, balance impact).
        localRuntime files(
                'libs/athena-4.7.3-neoforge-26.1.2.jar',
                'libs/geckolib-5.5.2-neoforge-26.1.2.jar',
                'libs/oritech-2.0.0-exp12-neoforge-26.1.2.jar',
        )
    }

    // Seasonal supply shop: Q Shop + Easy NPC + SG Economy (inventory gold UI).
    // compileOnly for the RS bridge; localRuntime for runClient. Disable: -Pshopstack=false
    // Celesthyd lives in libs/ (vendored from prior JIJ cache; SG Economy hard-requires it).
    // Soft-compat via reflection. Jars are vendored under libs/ (Curse/Modrinth Maven often
    // resolves POM-only for these artifacts in this project). Refresh with scripts if needed.
    // Disable: -Pshopstack=false (also off for GameTest).
    def shopStackEnabled = project.findProperty('shopstack') == 'true'
            || (project.findProperty('shopstack') != 'false' && !runningGameTests)
    if (shopStackEnabled) {
        localRuntime files(
                'libs/qshop-neoforge-26.1.2-1.8.4.jar',
                'libs/sg_economy-26.1.0.jar',
                'libs/celesthyd-26.1.0.jar',
                'libs/easy_npc-neoforge-26.1.2-7.16.0.jar',
                'libs/easy_npc_config_ui-neoforge-26.1.2-7.16.0.jar',
        )
    }

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Local / file Maven publish for addon authors (see docs/VERSIONING.md).
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group.toString()
            artifactId = project.base.archivesName.get()
            version = project.version.toString()
            from components.java
        }
    }
    repositories {
        maven {
            name = 'localRepo'
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.named('compileAddonExampleJava', JavaCompile).configure {
    dependsOn('compileJava')
}
tasks.named('compileMedicineAddonJava', JavaCompile).configure {
    dependsOn('compileJava')
}

// Sodium's Modrinth artifact is a thin wrapper; BlendedColorProvider lives in the nested jarjar mod.
configurations {
    sodiumExtract
}
dependencies {
    sodiumExtract "maven.modrinth:sodium:${sodium_version}"
}
tasks.register('extractSodiumApi') {
    def outJar = layout.buildDirectory.file('sodium-api/sodium-mod.jar')
    def sodiumOuter = configurations.sodiumExtract
    inputs.files(sodiumOuter)
    outputs.file(outJar)
    doLast {
        // Configuration-cache safe: pure NIO, no project.copy / zipTree.
        def outer = sodiumOuter.singleFile.toPath()
        def dest = outJar.get().asFile.toPath()
        java.nio.file.Files.createDirectories(dest.parent)
        def fs = java.nio.file.FileSystems.newFileSystem(outer, [:])
        try {
            def jarjar = fs.getPath('META-INF', 'jarjar')
            java.nio.file.Path nested = null
            if (java.nio.file.Files.isDirectory(jarjar)) {
                try (def stream = java.nio.file.Files.list(jarjar)) {
                    nested = stream
                            .filter { p -> p.fileName.toString().endsWith('.jar') }
                            .findFirst()
                            .orElse(null)
                }
            }
            if (nested != null) {
                java.nio.file.Files.copy(nested, dest, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } else {
                // Newer Sodium builds may ship as a flat mod jar (no jarjar wrapper).
                java.nio.file.Files.copy(outer, dest, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            fs.close()
        }
    }
}
tasks.named('compileJava').configure {
    dependsOn('extractSodiumApi')
}

// Deployment-profile input for tools/scan_missing_ko_kr.py (locale coverage).
tasks.register('writeRuntimeJarList') {
    group = 'verification'
    description = 'Writes the runtimeClasspath mod jar list to build/reports/runtime-jars.txt.'
    def jars = configurations.runtimeClasspath
    def out = layout.buildDirectory.file('reports/runtime-jars.txt')
    inputs.files(jars)
    outputs.file(out)
    doLast {
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.text = jars.files.findAll { it.name.endsWith('.jar') }.collect { it.absolutePath }.sort().join('\n') + '\n'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
